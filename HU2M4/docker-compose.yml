
version: '3.8'

services:
  db_universidad:
    image: postgres:15-alpine
    container_name: postgres_academico
    restart: always
    environment:
      POSTGRES_DB: gestion_academica_universidad
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
